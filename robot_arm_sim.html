<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4-DOF 로봇암 시뮬레이터</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#222;}
  h1{font-size:20px;font-weight:600;}
  .modes{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .modes button{flex:1;min-width:120px;padding:9px;border:2px solid #ccc;background:#fff;border-radius:8px;cursor:pointer;font-size:14px;}
  .modes button.active{border-color:#378ADD;background:#E6F1FB;}
  canvas{width:100%;height:auto;display:block;background:#f6f6f4;border-radius:10px;}
  .ctl{display:flex;align-items:center;gap:12px;margin:10px 0;}
  .ctl label{font-size:14px;color:#555;min-width:120px;}
  .ctl input[type=range]{flex:1;}
  .ctl span{font-size:14px;font-weight:600;min-width:50px;text-align:right;}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
  .card{background:#f1efe8;border-radius:8px;padding:10px;}
  .card .l{font-size:12px;color:#666;}
  .card .v{font-size:20px;font-weight:600;}
  .hint{font-size:13px;color:#666;margin:4px 0 8px;}
  .status{font-size:13px;margin-top:6px;font-weight:600;}
  button.play{width:100%;padding:10px;border:1px solid #bbb;border-radius:8px;background:#fff;cursor:pointer;font-size:14px;}
</style>
</head>
<body>
<h1>4-DOF 아크릴 로봇암 시뮬레이터</h1>

<div class="modes">
  <button id="m-fk" class="active">관절 직접 제어 (FK)</button>
  <button id="m-ik">목표점 도달 (IK)</button>
  <button id="m-traj">궤적 재생</button>
</div>

<canvas id="cv" width="720" height="460"></canvas>

<div class="ctl" style="margin-top:12px;">
  <label>집을 물체 무게 (g)</label>
  <input type="number" id="payload" value="50" min="0" max="2000" step="5" style="flex:1;padding:7px;border:1px solid #ccc;border-radius:8px;font-size:14px;">
  <span style="min-width:50px;"></span>
</div>

<div id="panel-fk">
  <div class="ctl"><label>J1 베이스 회전</label><input type="range" id="j1" min="-90" max="90" value="0"><span id="j1v">0°</span></div>
  <div class="ctl"><label>J2 어깨</label><input type="range" id="j2" min="-10" max="120" value="60"><span id="j2v">60°</span></div>
  <div class="ctl"><label>J3 팔꿈치</label><input type="range" id="j3" min="-130" max="20" value="-70"><span id="j3v">-70°</span></div>
  <div class="ctl"><label>J4 손목</label><input type="range" id="j4" min="-90" max="90" value="10"><span id="j4v">10°</span></div>
  <div class="ctl"><label>그리퍼</label><input type="range" id="grip" min="0" max="100" value="60"><span id="gripv">60%</span></div>
</div>

<div id="panel-ik" style="display:none;">
  <p class="hint">캔버스를 클릭하면 손끝이 그 지점으로 이동합니다. 또는 슬라이더로 좌표 지정:</p>
  <div class="ctl"><label>목표 X (mm)</label><input type="range" id="tx" min="-200" max="260" value="180"><span id="txv">180</span></div>
  <div class="ctl"><label>목표 Y (mm)</label><input type="range" id="ty" min="-40" max="320" value="120"><span id="tyv">120</span></div>
  <div class="status" id="ik-status"></div>
</div>

<div id="panel-traj" style="display:none;">
  <p class="hint">집기 → 옮기기 → 놓기 궤적을 재생합니다.</p>
  <button class="play" id="play">▶ 재생</button>
  <div class="status" id="traj-status" style="color:#666;font-weight:400;"></div>
</div>

<div class="cards">
  <div class="card"><div class="l">손끝 X</div><div class="v" id="ee-x">—</div></div>
  <div class="card"><div class="l">손끝 Y</div><div class="v" id="ee-y">—</div></div>
  <div class="card"><div class="l">도달거리</div><div class="v" id="ee-r">—</div></div>
</div>

<h2 style="font-size:16px;font-weight:600;margin:20px 0 4px;">모터 토크 (현재 자세, 중력 기준)</h2>
<p class="hint">각 서보가 버텨야 하는 정지 토크입니다. 서보 스펙의 stall torque와 비교하세요. 빨강 = 기본 서보(MG996R ≈ 9.4 kg·cm) 초과.</p>
<div class="cards">
  <div class="card"><div class="l">J2 어깨</div><div class="v" id="tq2">—</div></div>
  <div class="card"><div class="l">J3 팔꿈치</div><div class="v" id="tq3">—</div></div>
  <div class="card"><div class="l">J4 손목</div><div class="v" id="tq4">—</div></div>
</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const L={base:70,upper:150,fore:160,wrist:55};
const ox=240,oy=400,sc=0.85;
const W2C=(x,y)=>[ox+x*sc,oy-y*sc];
const C2W=(cx,cy)=>[(cx-ox)/sc,(oy-cy)/sc];
const D=Math.PI/180;
let mode='fk',q={j1:0,j2:60,j3:-70,j4:10},grip=60;

// --- 질량 기본값 (g). 아크릴 팔 기준 근사치, 자유롭게 수정 ---
const MASS={
  upper:40,   // 어퍼암 링크
  fore:35,    // 포어암 링크
  wrist:25,   // 손목+그리퍼 구조물
  motorElbow:55, // 팔꿈치에 얹힌 서보
  motorWrist:50, // 손목에 얹힌 서보
};
const SERVO_STALL=9.4; // 기준 서보 stall torque (kg·cm), MG996R 근사

// 토크 계산: 각 관절보다 바깥의 질량 × 수평 모멘트팔 합산. 입력 mm, 출력 kg·cm
function torques(p0,p1,p2,p3){
  const payload=Math.max(0,+document.getElementById('payload').value||0); // g
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const cgUpper=mid(p0,p1), cgFore=mid(p1,p2), cgWrist=mid(p2,p3);
  const items=[
    {m:MASS.upper, pos:cgUpper},
    {m:MASS.motorElbow, pos:p1},
    {m:MASS.fore, pos:cgFore},
    {m:MASS.motorWrist, pos:p2},
    {m:MASS.wrist, pos:cgWrist},
    {m:payload, pos:p3},
  ];
  const pivots={j2:p0, j3:p1, j4:p2};
  const startIdx={j2:0, j3:2, j4:4};
  const out={};
  for(const k of ['j2','j3','j4']){
    let tau=0;
    for(let i=startIdx[k];i<items.length;i++){
      const dx_cm=(items[i].pos[0]-pivots[k][0])/10; // 수평거리 cm
      const w_kg=items[i].m/1000;                     // kg
      tau += w_kg*Math.abs(dx_cm);                    // kg·cm
    }
    out[k]=tau;
  }
  return out;
}

function fk(j2,j3,j4){
  const a2=j2*D,a3=a2+j3*D,a4=a3+j4*D;
  const p0=[0,L.base];
  const p1=[p0[0]+L.upper*Math.cos(a2),p0[1]+L.upper*Math.sin(a2)];
  const p2=[p1[0]+L.fore*Math.cos(a3),p1[1]+L.fore*Math.sin(a3)];
  const p3=[p2[0]+L.wrist*Math.cos(a4),p2[1]+L.wrist*Math.sin(a4)];
  return[p0,p1,p2,p3];
}
function ik(tx,ty){
  const sy=L.base,dx=tx,dy=ty-sy,r=Math.hypot(dx,dy);
  const l1=L.upper,l2=L.fore+L.wrist*0.5;
  const c=Math.max(-1,Math.min(1,(r*r-l1*l1-l2*l2)/(2*l1*l2)));
  const e=Math.acos(c),base=Math.atan2(dy,dx);
  const adj=Math.atan2(l2*Math.sin(e),l1+l2*Math.cos(e));
  return{j2:(base+adj)/D,j3:-e/D,j4:10,ok:r<=(l1+l2-1)};
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.strokeStyle='#ccc';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(20,oy);ctx.lineTo(cv.width-20,oy);ctx.stroke();
  ctx.fillStyle='#e8e6df';ctx.fillRect(ox-55,oy-6,110,12);
  const[p0,p1,p2,p3]=fk(q.j2,q.j3,q.j4);
  const c0=W2C(...p0),c1=W2C(...p1),c2=W2C(...p2),c3=W2C(...p3),cb=W2C(0,0);
  ctx.lineCap='round';
  ctx.strokeStyle='#888';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(...cb);ctx.lineTo(...c0);ctx.stroke();
  ctx.strokeStyle='#378ADD';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(...c0);ctx.lineTo(...c1);ctx.stroke();
  ctx.strokeStyle='#1D9E75';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(...c1);ctx.lineTo(...c2);ctx.stroke();
  ctx.strokeStyle='#D85A30';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(...c2);ctx.lineTo(...c3);ctx.stroke();
  const a4=(q.j2+q.j3+q.j4)*D,open=6+grip/100*14;
  const nx=Math.cos(a4+Math.PI/2),ny=Math.sin(a4+Math.PI/2);
  ctx.strokeStyle='#222';ctx.lineWidth=4;
  for(const s of[1,-1]){
    const jb=[c3[0]+nx*open*s,c3[1]-ny*open*s];
    const jt=[jb[0]+Math.cos(a4)*16,jb[1]-Math.sin(a4)*16];
    ctx.beginPath();ctx.moveTo(...c3);ctx.lineTo(...jb);ctx.lineTo(...jt);ctx.stroke();
  }
  const dot=(c,clr)=>{ctx.fillStyle=clr;ctx.beginPath();ctx.arc(c[0],c[1],6,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();};
  dot(c0,'#185FA5');dot(c1,'#0F6E56');dot(c2,'#993C1D');
  ctx.strokeStyle='#bbb';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(cb[0],cb[1]+18,46,12,0,0,7);ctx.stroke();
  const j1r=q.j1*D;ctx.strokeStyle='#534AB7';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(cb[0],cb[1]+18);ctx.lineTo(cb[0]+Math.sin(j1r)*40,cb[1]+18-Math.cos(j1r)*10);ctx.stroke();
  if(mode==='ik'){
    const t=W2C(+tx.value,+ty.value);ctx.strokeStyle='#E24B4A';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(t[0],t[1],9,0,7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(t[0]-13,t[1]);ctx.lineTo(t[0]+13,t[1]);ctx.moveTo(t[0],t[1]-13);ctx.lineTo(t[0],t[1]+13);ctx.stroke();
  }
  document.getElementById('ee-x').textContent=Math.round(p3[0])+' mm';
  document.getElementById('ee-y').textContent=Math.round(p3[1])+' mm';
  document.getElementById('ee-r').textContent=Math.round(Math.hypot(p3[0],p3[1]))+' mm';

  const tq=torques(p0,p1,p2,p3);
  for(const k of [['j2','tq2'],['j3','tq3'],['j4','tq4']]){
    const el=document.getElementById(k[1]);
    el.textContent=tq[k[0]].toFixed(1)+' kg·cm';
    el.style.color = tq[k[0]]>SERVO_STALL ? '#E24B4A' : '#222';
  }
}
const sl={j1:j1,j2:j2,j3:j3,j4:j4};
for(const k in sl)sl[k].addEventListener('input',()=>{if(mode!=='fk')return;q[k]=+sl[k].value;document.getElementById(k+'v').textContent=sl[k].value+'°';draw();});
grip_el=document.getElementById('grip');
grip_el.addEventListener('input',()=>{grip=+grip_el.value;document.getElementById('gripv').textContent=grip_el.value+'%';draw();});
const tx=document.getElementById('tx'),ty=document.getElementById('ty');
function solveIK(){const s=ik(+tx.value,+ty.value);q.j2=s.j2;q.j3=s.j3;q.j4=s.j4;
  document.getElementById('txv').textContent=tx.value;document.getElementById('tyv').textContent=ty.value;
  const st=document.getElementById('ik-status');st.textContent=s.ok?'✓ 도달 가능':'✗ 작업영역 밖 — 최대한 뻗음';
  st.style.color=s.ok?'#0F6E56':'#E24B4A';draw();}
tx.addEventListener('input',solveIK);ty.addEventListener('input',solveIK);
cv.addEventListener('click',e=>{if(mode!=='ik')return;const r=cv.getBoundingClientRect();
  const cx=(e.clientX-r.left)*(cv.width/r.width),cy=(e.clientY-r.top)*(cv.height/r.height);
  const[wx,wy]=C2W(cx,cy);tx.value=Math.round(Math.max(-200,Math.min(260,wx)));
  ty.value=Math.round(Math.max(-40,Math.min(320,wy)));solveIK();});
const WP=[
  {j1:0,j2:60,j3:-70,j4:10,grip:80,label:'대기 자세'},
  {j1:-40,j2:30,j3:-40,j4:20,grip:80,label:'물체 위로 접근'},
  {j1:-40,j2:18,j3:-25,j4:15,grip:80,label:'하강'},
  {j1:-40,j2:18,j3:-25,j4:15,grip:15,label:'집기 (그리퍼 닫음)'},
  {j1:-40,j2:45,j3:-55,j4:15,grip:15,label:'들어올림'},
  {j1:45,j2:45,j3:-55,j4:15,grip:15,label:'반대편 회전'},
  {j1:45,j2:20,j3:-30,j4:15,grip:15,label:'하강'},
  {j1:45,j2:20,j3:-30,j4:15,grip:85,label:'놓기 (그리퍼 열음)'},
  {j1:0,j2:60,j3:-70,j4:10,grip:80,label:'대기 복귀'},
];
let playing=false;const lerp=(a,b,t)=>a+(b-a)*t;
async function play(){if(playing)return;playing=true;const st=document.getElementById('traj-status');
  for(let i=0;i<WP.length-1;i++){const A=WP[i],B=WP[i+1];st.textContent=(i+1)+'/'+(WP.length-1)+' · '+B.label;
    for(let s=0;s<=28;s++){const t=s/28;q.j1=lerp(A.j1,B.j1,t);q.j2=lerp(A.j2,B.j2,t);
      q.j3=lerp(A.j3,B.j3,t);q.j4=lerp(A.j4,B.j4,t);grip=lerp(A.grip,B.grip,t);draw();
      await new Promise(r=>setTimeout(r,16));}}
  st.textContent='완료 ✓';playing=false;}
document.getElementById('play').addEventListener('click',play);
const panels={fk:'panel-fk',ik:'panel-ik',traj:'panel-traj'},btns={fk:'m-fk',ik:'m-ik',traj:'m-traj'};
function setMode(m){mode=m;for(const k in panels){document.getElementById(panels[k]).style.display=k===m?'block':'none';
  document.getElementById(btns[k]).classList.toggle('active',k===m);}if(m==='ik')solveIK();else draw();}
document.getElementById('m-fk').onclick=()=>setMode('fk');
document.getElementById('m-ik').onclick=()=>setMode('ik');
document.getElementById('m-traj').onclick=()=>setMode('traj');
document.getElementById('payload').addEventListener('input',draw);
draw();
</script>
</body>
</html>
